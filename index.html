            padding: 5px 8px;

        </select>
        <label>册数：</label>

        </select>

        <select id="level5" disabled style="display:none">

        </select>
    </div>

            advance: {
                name: "提高教程",
                books: {
                    book4: {
                        name: "全一册",
                        pdfUrl: "https://github.com/CGTiger/CGTiger.github.io/raw/main/Textbook/Book 4.pdf",
                        lessonRanges: [
                            {val:"01-12", name:"Lesson 01~12", start:1, end:12},
                            {val:"13-24", name:"Lesson 13~24", start:13, end:24},
                            {val:"25-36", name:"Lesson 25~36", start:25, end:36},
                            {val:"37-48", name:"Lesson 37~48", start:37, end:48},
                            {val:"49-60", name:"Lesson 49~60", start:49, end:60},
                            {val:"61-72", name:"Lesson 61~72", start:61, end:72},
                        ]
                    }
                }
            }
        };
        const level1Sel = document.getElementById('level1');   // 教材级别
        const level2Sel = document.getElementById('level2');   // 教程类型
        const level3Sel = document.getElementById('level3');   // 册数
        const level4Sel = document.getElementById('level4');   // 资源类型
        const level5Sel = document.getElementById('level5');   // 单元/课序号
        const level5Label = document.getElementById('level5-label');
        const contentBox = document.getElementById('contentBox');

        // 一级：教材级别 → 填充教程类型
        level1Sel.addEventListener('change', function(){
            level2Sel.innerHTML = '<option value="">请先选择教材级别</option>';
            level3Sel.innerHTML = '<option value="">请先选择教程类型</option>';
            level4Sel.innerHTML = '<option value="">请先选择册数</option>';
            level5Sel.innerHTML = '<option value="">请先选择资源类型</option>';
            level2Sel.disabled = true;
            level3Sel.disabled = true;
            level4Sel.disabled = true;
            level5Sel.disabled = true;
            level5Sel.style.display = 'none';
            contentBox.innerHTML = '';
            level5Label.innerText = "单元：";
            if(!this.value){
                return;
            }
            // 教程类型固定两项：基础教程 / 提高教程
            level2Sel.innerHTML = '<option value="">请选择教程类型</option><option value="basic">基础教程</option><option value="advance">提高教程</option>';
            level2Sel.disabled = false;
        })

        // 二级：教程类型 → 填充册数
        level2Sel.addEventListener('change', function(){
            const val = this.value;
            level3Sel.innerHTML = '<option value="">请先选择教程类型</option>';
            level4Sel.innerHTML = '<option value="">请先选择册数</option>';
            level5Sel.innerHTML = '<option value="">请先选择资源类型</option>';
            level3Sel.disabled = true;
            level4Sel.disabled = true;
            level5Sel.disabled = true;
            level5Sel.style.display = 'none';
            contentBox.innerHTML = '';
            level5Label.innerText = "单元：";
            if(!val){
                return;
            }
            level3Sel.disabled = false;
            const books = bookData[val].books;
            level3Sel.innerHTML = '<option value="">请选择册数</option>';
            for(let key in books){
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = books[key].name;
                level3Sel.appendChild(opt);
            }
        })

        // 三级：册数 → 解锁资源类型
        level3Sel.addEventListener('change', function(){
            level4Sel.value = "";
            level5Sel.value = "";
            level5Sel.disabled = true;
            level5Sel.style.display = 'none';
            contentBox.innerHTML = '';
            level5Label.innerText = "单元：";
            if(!this.value){
                level4Sel.disabled = true;
                return;
            }
            level4Sel.disabled = false;
        })

        // 四级：资源类型
        level4Sel.addEventListener('change', function(){
            const typeVal = level2Sel.value;
            const bookVal = level3Sel.value;
            const resType = this.value;
            const bookInfo = bookData[typeVal].books[bookVal];
            // 重置第五级
            level5Sel.innerHTML = '<option value="">请选择</option>';
            level5Sel.value = "";
            level5Sel.disabled = true;
            level5Sel.style.display = 'none';
            contentBox.innerHTML = '';
            if(!resType) return;
            if(resType === "textbook"){
                // 教材：直接渲染，无第五级
                contentBox.innerHTML = `
                    <h2>教材</h2>
                    <p>
                        <button class="textbook-btn" data-pdf="${bookInfo.pdfUrl}">${bookData[typeVal].name}-${bookInfo.name}</button>
                    </p>
                    <iframe id="pdfFrame" style="width:100%;height:80vh;display:none;border:1px solid #aaa;"></iframe>
                `;
                const pdfBtn = contentBox.querySelector(".textbook-btn");
                const pdfFrame = contentBox.querySelector("#pdfFrame");
                pdfBtn.onclick = function(){
                    let rawUrl = this.dataset.pdf;
                    let previewUrl = rawUrl.replace("github.com", "pdfgithub.com");
                    previewUrl = previewUrl.replace("raw/main", "blob/main");
                    const pdfLink = previewUrl + "#toolbar=0";
                    window.open(pdfLink, "_blank");
                }
            }else if(resType === "audio"){
                // 配套音频：解锁第五级
                level5Sel.style.display = '';
                level5Sel.disabled = false;
                if(typeVal === "advance"){
                    // 提高教程：第五级标签改为【课序号】，选项为Lesson区间
                    level5Label.innerText = "课序号：";
                    const ranges = bookInfo.lessonRanges;
                    ranges.forEach(range=>{
                        const opt = document.createElement('option');
                        opt.value = range.val;
                        opt.innerText = range.name;
                        level5Sel.appendChild(opt);
                    })
                }else{
                    // 基础教程：保持原有【单元】
                    level5Label.innerText = "单元：";
                    const units = bookInfo.units;
                    for(let key in units){
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.innerText = units[key].name;
                        level5Sel.appendChild(opt);
                    }
                }
            }
        })

        // 五级：单元 / 课序号
        level5Sel.addEventListener('change', function(){
            const typeVal = level2Sel.value;
            const bookVal = level3Sel.value;
            const selectVal = this.value;
            contentBox.innerHTML = '';
            if(!selectVal) return;
            const bookInfo = bookData[typeVal].books[bookVal];
            if(typeVal === "advance"){
                // ========== 提高教程逻辑：课序号区间，3行×4个按钮 ==========
                const rangeItem = bookInfo.lessonRanges.find(r=>r.val === selectVal);
                if(!rangeItem) return;
                let html = `<h2>配套音频</h2><h3>${bookInfo.name}</h3><h4>${rangeItem.name}</h4>`;
                let count = 0;
                for(let i = rangeItem.start; i <= rangeItem.end; i++){
                    const numStr = String(i).padStart(2,'0');
                    const audioUrl = `https://github.com/CGTiger/CGTiger.github.io/raw/main/Intermediate/Audio/Book 4/Lesson ${numStr}.mp3`;
                    html += `<button class="audio-btn" data-audio="${audioUrl}">Lesson ${numStr}</button>`;
                    count++;
                    if(count %4 ===0){
                        html += "<br/>"; // 每4个换行
                    }
                }
                contentBox.innerHTML = html;
            }else{
                // ========== 基础教程原有单元逻辑不变 ==========
                const unitInfo = bookInfo.units[selectVal];
                let html = `
                    <h2>配套音频</h2>
                    <h3>${bookInfo.name}</h3>
                    <h4> ${unitInfo.name}</h4>
                `;
                const groups = unitInfo.groups;
                for(let gName in groups){
                    html += `<p>${gName}：`;
                    groups[gName].forEach(item=>{
                        html += `<button class="audio-btn" data-audio="${item.url}">${item.label}</button> `
                    })
                    html += `</p>`;
                }
                contentBox.innerHTML = html;
            }
        })

        // ========== 原有完整音频播放器逻辑，原样保留 ==========
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        let currentAudioSrc = ""; // 记录当前正在播放的音频地址
        // 事件委托：动态生成的audio-btn也可以触发点击
        document.addEventListener('click', function (e) {
            if(e.target.classList.contains('audio-btn')){
                const audioSrc = e.target.dataset.audio;
                // 判断：点击的是当前正在播放的音频
                if (audioSrc === currentAudioSrc && audioContainer.style.display === 'block') {
                    // 停止播放，重置，隐藏播放器
                    audioPlayer.pause();
                    audioPlayer.currentTime = 0;
                    audioContainer.style.display = 'none';
                    currentAudioSrc = "";
                } else {
                    // 切换为新音频，加载并播放
                    audioPlayer.src = audioSrc;
                    currentAudioSrc = audioSrc;
                    audioContainer.style.display = 'block';
                    audioPlayer.load();
                    audioPlayer.play().catch(function (err) {
                        console.log("浏览器自动播放限制，请手动点击播放器播放", err);
                    });
                }
            }
        });
        // 禁用右键菜单
        document.addEventListener('contextmenu',e=>e.preventDefault());
        // 简单检测开发者工具打开（仅告警，无法彻底阻断）
        let devOpen = false;
        const devCheck = function(){
            const threshold = 160;
            if(window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold){
                if(!devOpen){
                    devOpen = true;
                    alert("禁止打开开发者工具");
                }
            }else{
                devOpen = false;
            }
        };
        setInterval(devCheck,1000);
        // 禁用F12、Ctrl+U、Ctrl+Shift+I
        document.addEventListener('keydown',function(e){
            if(
                e.key === 'F12'
                || (e.ctrlKey && e.key === 'u')
                || (e.ctrlKey && e.shiftKey && e.key === 'I')
                || (e.ctrlKey && e.shiftKey && e.key === 'J')
            ){
                e.preventDefault();
            }
        });
    </script>
